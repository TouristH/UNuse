name: Request Review / 请求管理员审核
description: UNuse 已停止维护；此表单仅保留历史审核流程
title: "[Review] "
labels: ["review-request"]
body:
  - type: markdown
    attributes:
      value: |
        > **废弃在线仓库：UNuse 已停止维护。** 本表单不会再处理新的审核请求，
        > 下列字段仅用于保留原有固定版本与哈希审核边界。
  - type: input
    id: plugin-id
    attributes:
      label: 插件 ID / Plugin ID
      placeholder: io.github.example.toolbox
    validations:
      required: true
  - type: input
    id: generation
    attributes:
      label: 代际 / Generation
      description: 默认首次发布为 1；转让后的新发布者使用 2、3……
      placeholder: "1"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      placeholder: 1.2.0
    validations:
      required: true
  - type: input
    id: source-commit
    attributes:
      label: 对应源码提交 / Source commit
      description: 建议填写构建该 Release ZIP 的完整 Git commit URL。
    validations:
      required: true
  - type: textarea
    id: build-notes
    attributes:
      label: 构建与审核说明 / Build and review notes
      description: 说明依赖、构建命令、测试方法及高风险能力用途。
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        管理员审核是人工流程，精确绑定插件 ID、版本和 Release ZIP SHA-256。
        Issue 创建后机器人会从中心历史读取 canonical SHA-256，并显示一条可复制的
        `/verify id@generation:version sha256:...` 命令。请求被接受并不保证一定获得 `verified` 标志。
