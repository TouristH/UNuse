name: Queue Plugin / 插件收录兜底
description: UNuse 已停止维护；此表单仅保留历史收录流程
title: "[Plugin] "
labels: ["plugin-submission", "queued-for-intake"]
body:
  - type: markdown
    attributes:
      value: |
        > **废弃在线仓库：UNuse 已停止维护。** 本表单不会再处理新的插件收录请求，
        > 下列内容仅用于保留原有安全要求和历史流程。

        历史流程通过约定的 discovery Topic 自动发现作者仓库。
        如果 GitHub Topic 索引尚未更新，可提交此 Issue 进入同一收录队列；不需要等待管理员
        输入 `/validate` 或 `/approve`。机器人会校验固定 Release ZIP、SHA-256、包内
        `plugin.json` 和入口 DLL，成功后以“未审核”状态加入中心。
  - type: input
    id: plugin-id
    attributes:
      label: 插件 ID / Plugin ID
      description: 自动收录使用 `io.github.<仓库所有者小写>.<名称>`，并与清单及 ZIP 完全一致。
      placeholder: io.github.example.toolbox
    validations:
      required: true
  - type: input
    id: repository-url
    attributes:
      label: 仓库地址 / Repository URL
      description: 公开 GitHub 仓库根地址，不要填写 .git、分支或文件 URL。
      placeholder: https://github.com/example/unuse-toolbox
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 发布确认 / Release checklist
      options:
        - label: 仓库默认分支根目录包含符合模板的 `_manifest.json`
          required: true
        - label: 插件 ID 使用 `io.github.<仓库所有者小写>.` 名空间
          required: true
        - label: "`_manifest.json` 的 releases[] 完整保留所有版本，且每项指向固定标签 Release ZIP"
          required: true
        - label: ZIP 根目录直接包含 `plugin.json` 和入口 DLL
          required: true
        - label: 我已核对 ZIP 的精确字节数和小写 SHA-256
          required: true
        - label: 我有权发布该插件及其依赖，并已如实声明能力和风险
          required: true
        - label: 我理解机器人自动收录不等于管理员审核，未经审核版本会向用户显示风险警告
          required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充说明 / Notes
      description: 可选。请说明用途、特殊依赖或测试方式。
    validations:
      required: false
