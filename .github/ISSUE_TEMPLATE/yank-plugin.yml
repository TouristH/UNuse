name: Yank Release / 撤回版本
description: UNuse 已停止维护；此表单仅保留历史撤回流程
title: "[Yank] "
labels: ["plugin-yank", "pending-review"]
body:
  - type: markdown
    attributes:
      value: |
        > **废弃在线仓库：UNuse 已停止维护。** 本表单不会再处理新的撤回请求，
        > 下列字段仅用于保留原有历史记录与安全说明。
  - type: input
    id: plugin-id
    attributes:
      label: 插件 ID / Plugin ID
      placeholder: io.github.example.toolbox
    validations:
      required: true
  - type: input
    id: generation
    attributes:
      label: 代际 / Generation
      description: 首次发布为 1；转让后的新发布者使用 2、3……
      placeholder: "1"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 版本 / Versions
      description: 逗号分隔的严格 SemVer；填写 all 表示撤回全部版本。
      placeholder: 1.0.0, 1.1.0
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 撤回原因 / Reason
      description: 不要在这里公开可直接利用的漏洞细节，敏感内容请使用 Security Advisory。
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我理解撤回不会删除历史记录，启动器将不再允许安装这些版本
          required: true
